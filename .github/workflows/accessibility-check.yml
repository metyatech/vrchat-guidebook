name: Accessibility Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pa11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install automation runtime
        run: python -m pip install --disable-pip-version-check -r automation/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Configure Selenium Chromium
        run: |
          chromium_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -111 | head -n 1)"
          test -n "$chromium_path"
          echo "SE_BROWSER_PATH=$chromium_path" >> "$GITHUB_ENV"

      - name: Run accessibility verification
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run verify
